<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes From The Underground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;1,7..72,300;1,7..72,400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t = localStorage.getItem('leemos-theme') || 'light';
      document.documentElement.className = t;
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="progress-bar" role="progressbar" aria-hidden="true"></div>

<!-- Splash -->
<div id="splash">
  <h1 id="splash-title"></h1>
  <p id="splash-author"></p>
</div>

<!-- Transition overlay (between companion and character) -->
<div id="transition-overlay">
  <span id="transition-text">Chapter ends</span>
</div>

<!-- Main interface -->
<div id="interface">

  <!-- Left: Reading column -->
  <div id="reading-col">
    <header id="chapter-header">
      <span id="chapter-label">—</span>
      <nav id="toolbar-strip" aria-label="Reader controls">

        <button class="tool-btn" id="btn-toc" title="Contents">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="0" y1="1"  x2="16" y2="1"/>
            <line x1="0" y1="6"  x2="12" y2="6"/>
            <line x1="0" y1="11" x2="9"  y2="11"/>
          </svg>
          Contents
        </button>

        <div class="tool-sep"></div>

        <button class="tool-btn" id="btn-font-minus" title="Smaller text">A−</button>
        <button class="tool-btn" id="btn-font-plus"  title="Larger text">A+</button>
        <button class="tool-btn" id="btn-font-toggle" title="Toggle font"></button>

        <div class="tool-sep"></div>

        <button class="tool-btn" data-theme="light"  title="Light">☀</button>
        <button class="tool-btn" data-theme="sepia"  title="Sepia">◑</button>
        <button class="tool-btn" data-theme="dark"   title="Dark">☽</button>

      </nav>
    </header>

    <div id="prose-scroll">
      <div id="prose-inner">
        <article id="prose"></article>
      </div>
    </div>

    <div id="reveal-footer">
      <span id="para-progress"></span>
      <button id="btn-reveal">↓ Continue</button>
      <button id="btn-end-chapter">End Chapter →</button>
      <button id="btn-next-chapter">Next Chapter →</button>
    </div>
  </div>

  <!-- Right: Chat panel -->
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-who">Reading companion</span>
      <span id="chat-identity-name">—</span>
    </div>
    <div id="chat-messages" aria-live="polite"></div>
    <div id="chat-input-area">
      <textarea id="chat-input" rows="1"
        placeholder="Talk to your companion…"
        autocomplete="off" spellcheck="false"></textarea>
      <button id="btn-send" aria-label="Send">↑</button>
    </div>
  </div>

</div>

<!-- TOC -->
<div id="toc-backdrop"></div>
<nav id="toc-panel" aria-label="Table of contents">
  <header id="toc-header">
    <h2 id="toc-title">Contents</h2>
    <button id="toc-close">&#215;</button>
  </header>
  <ul id="toc-list"></ul>
</nav>

<script>
(function () {
'use strict';

// ─── Config ──────────────────────────────────────────────────────────────────
var BOOK_ID   = 1;
var FONT_MIN  = 16;
var FONT_MAX  = 26;
var API_BASE  = '';

// ─── State ────────────────────────────────────────────────────────────────────
var BOOK = { title: '', author: '', chapters: [] };

// phase: 'reading' | 'transitioning' | 'character'
var state = {
  chapterIndex:    parseInt(localStorage.getItem('leemos-ch')    || '0', 10),
  revealedCount:   0,                 // paragraphs visible in current chapter
  fontSize:        parseInt(localStorage.getItem('leemos-size')  || '20', 10),
  fontFamily:      localStorage.getItem('leemos-font')           || 'serif',
  theme:           localStorage.getItem('leemos-theme')          || 'light',
  phase:           'reading',         // 'reading' | 'transitioning' | 'character'
  companionMsgs:   [],                // {role:'user'|'assistant', content:string}[]
  characterMsgs:   [],
  companionStance: '',
  aiTyping:        false,
};

state.fontSize = Math.max(FONT_MIN, Math.min(FONT_MAX, state.fontSize));

// ─── DOM refs ─────────────────────────────────────────────────────────────────
var $splashEl     = document.getElementById('splash');
var $splashTitle  = document.getElementById('splash-title');
var $splashAuthor = document.getElementById('splash-author');
var $progress     = document.getElementById('progress-bar');
var $chLabel      = document.getElementById('chapter-label');
var $prose        = document.getElementById('prose');
var $proseScroll  = document.getElementById('prose-scroll');
var $paraProgress = document.getElementById('para-progress');
var $btnReveal    = document.getElementById('btn-reveal');
var $btnEnd       = document.getElementById('btn-end-chapter');
var $btnNext      = document.getElementById('btn-next-chapter');
var $chatPanel    = document.getElementById('chat-panel');
var $chatWho      = document.getElementById('chat-who');
var $chatName     = document.getElementById('chat-identity-name');
var $chatMessages = document.getElementById('chat-messages');
var $chatInput    = document.getElementById('chat-input');
var $btnSend      = document.getElementById('btn-send');
var $transOverlay = document.getElementById('transition-overlay');
var $transText    = document.getElementById('transition-text');
var $tocBackdrop  = document.getElementById('toc-backdrop');
var $tocPanel     = document.getElementById('toc-panel');
var $tocList      = document.getElementById('toc-list');
var $tocClose     = document.getElementById('toc-close');
var $btnToc       = document.getElementById('btn-toc');
var $btnFontMinus = document.getElementById('btn-font-minus');
var $btnFontPlus  = document.getElementById('btn-font-plus');
var $btnFontToggle= document.getElementById('btn-font-toggle');

// ─── Book loading ─────────────────────────────────────────────────────────────

function normaliseChapter(row) {
  var prose = (row.prose || '').replace(/\r\n?/g, '\n');
  var nl    = prose.indexOf('\n');
  var title, content;
  if (nl === -1) {
    title   = 'Chapter ' + row.position;
    content = prose;
  } else {
    title   = prose.slice(0, nl).trim() || ('Chapter ' + row.position);
    content = prose.slice(nl + 1).replace(/^\n+/, '');
  }
  var paragraphs = content
    .split(/\n{2,}/)
    .map(function (p) { return p.replace(/\s*\n\s*/g, ' ').trim(); })
    .filter(function (p) { return p.length > 0; });
  return { title: title, paragraphs: paragraphs };
}

function loadBook() {
  return fetch(API_BASE + '/api/books/' + BOOK_ID)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      BOOK.title    = data.title  || '';
      BOOK.author   = data.author || '';
      BOOK.chapters = (data.chapters || [])
        .slice()
        .sort(function (a, b) { return a.position - b.position; })
        .map(normaliseChapter);
      if (BOOK.title) {
        document.title = BOOK.title;
        if ($splashTitle)  $splashTitle.textContent  = BOOK.title;
        if ($splashAuthor) $splashAuthor.textContent = BOOK.author;
      }
    });
}

// ─── Chapter setup ────────────────────────────────────────────────────────────

function currentChapter() {
  return BOOK.chapters[state.chapterIndex] || { title: '', paragraphs: [] };
}

function startChapter(idx, resetChat) {
  state.chapterIndex  = Math.max(0, Math.min(idx, BOOK.chapters.length - 1));
  state.revealedCount = 1;
  state.phase         = 'reading';
  if (resetChat !== false) {
    state.companionMsgs   = [];
    state.characterMsgs   = [];
    state.companionStance = '';
  }
  saveProgress();
  $proseScroll.scrollTop = 0;
  renderChapter();
  updateChatPanel();
  $chatMessages.innerHTML = '';
  $chatInput.placeholder = 'Talk to your companion\u2026';
  $chatInput.disabled    = false;
  $btnSend.disabled      = false;
}

function saveProgress() {
  localStorage.setItem('leemos-ch', String(state.chapterIndex));
}

// ─── Prose rendering ──────────────────────────────────────────────────────────

function renderChapter() {
  var ch    = currentChapter();
  var paras = ch.paragraphs;

  // Rebuild visible paragraphs
  $prose.innerHTML = '';
  for (var i = 0; i < Math.min(state.revealedCount, paras.length); i++) {
    var p = document.createElement('p');
    p.textContent = paras[i];
    if (i === state.revealedCount - 1) {
      p.classList.add('para-new');
    }
    $prose.appendChild(p);
  }

  // Chapter label
  $chLabel.textContent = ch.title;

  // Paragraph progress
  var total = paras.length;
  var shown = Math.min(state.revealedCount, total);
  $paraProgress.textContent = shown + '\u202f/\u202f' + total;

  // Progress bar (across all chapters)
  var totalParas = 0, doneBefore = 0;
  for (var ci = 0; ci < BOOK.chapters.length; ci++) {
    totalParas += BOOK.chapters[ci].paragraphs.length;
    if (ci < state.chapterIndex) doneBefore += BOOK.chapters[ci].paragraphs.length;
  }
  var pct = totalParas > 0
    ? ((doneBefore + shown) / totalParas) * 100
    : 0;
  $progress.style.width = pct + '%';

  // Reveal / end-chapter / next-chapter buttons
  var allShown = shown >= total;

  if (state.phase === 'character') {
    // In character mode: hide reading controls, show next-chapter button
    $btnReveal.style.display = 'none';
    $btnEnd.classList.remove('visible');
    $btnNext.classList.toggle(
      'visible',
      state.chapterIndex < BOOK.chapters.length - 1
    );
  } else {
    $btnReveal.style.display = allShown ? 'none' : '';
    $btnEnd.classList.toggle('visible', allShown);
    $btnNext.classList.remove('visible');
  }

  // Scroll last paragraph into view
  var lastP = $prose.lastElementChild;
  if (lastP) {
    setTimeout(function () {
      lastP.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }

  applyFont();
}

function revealNext() {
  var ch = currentChapter();
  if (state.revealedCount < ch.paragraphs.length) {
    state.revealedCount++;
    renderChapter();
  }
}

// ─── Font & theme ─────────────────────────────────────────────────────────────

function applyFont() {
  var ff = state.fontFamily === 'sans'
    ? 'system-ui, -apple-system, BlinkMacSystemFont, sans-serif'
    : "'Literata', Georgia, Cambria, 'Times New Roman', serif";
  $prose.style.fontFamily = ff;
  $prose.style.fontSize   = state.fontSize + 'px';
  $btnFontToggle.textContent = state.fontFamily === 'sans' ? 'Serif' : 'Sans';
  localStorage.setItem('leemos-font', state.fontFamily);
  localStorage.setItem('leemos-size', String(state.fontSize));
}

function setTheme(t) {
  state.theme = t;
  document.documentElement.className = t;
  localStorage.setItem('leemos-theme', t);
  document.querySelectorAll('[data-theme]').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-theme') === t);
  });
}

// ─── Chat panel display ───────────────────────────────────────────────────────

function updateChatPanel() {
  if (state.phase === 'character') {
    $chatPanel.classList.add('character-mode');
    $chatWho.textContent  = 'Speaking with';
    $chatName.textContent = 'The Underground Man';
    $chatInput.placeholder = 'Address him\u2026';
  } else {
    $chatPanel.classList.remove('character-mode');
    $chatWho.textContent  = 'Reading companion';
    $chatName.textContent = BOOK.title || '\u2014';
    $chatInput.placeholder = 'Talk to your companion\u2026';
  }
}

// ─── Message rendering ────────────────────────────────────────────────────────

function appendMessage(role, text, opts) {
  opts = opts || {};
  var div = document.createElement('div');
  div.classList.add('msg');
  if (role === 'assistant' || role === 'ai') {
    div.classList.add('ai');
  } else if (role === 'user') {
    div.classList.add('user');
  } else {
    div.classList.add('system-note');
  }
  if (opts.streaming) div.classList.add('streaming');
  div.textContent = text;
  $chatMessages.appendChild(div);
  $chatMessages.scrollTop = $chatMessages.scrollHeight;
  return div;
}

// ─── Streaming SSE helper ─────────────────────────────────────────────────────

function streamChat(endpoint, body, onDelta, onDone, onError) {
  fetch(API_BASE + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(function (res) {
    if (!res.ok) { onError('API error ' + res.status); return; }
    var reader  = res.body.getReader();
    var decoder = new TextDecoder();
    var buf     = '';
    function pump() {
      reader.read().then(function (result) {
        if (result.done) { onDone(); return; }
        buf += decoder.decode(result.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();
        lines.forEach(function (line) {
          if (!line.startsWith('data: ')) return;
          try {
            var evt = JSON.parse(line.slice(6));
            if (evt.delta)    onDelta(evt.delta);
            if (evt.done)     onDone();
            if (evt.error)    onError('AI went quiet.');
          } catch (e) {}
        });
        pump();
      }).catch(function (e) { onError(String(e)); });
    }
    pump();
  }).catch(function (e) { onError(String(e)); });
}

// ─── Send companion message ───────────────────────────────────────────────────

function sendCompanion(userText) {
  if (state.aiTyping || !userText.trim()) return;
  state.aiTyping = true;
  $btnSend.disabled = true;

  appendMessage('user', userText);
  state.companionMsgs.push({ role: 'user', content: userText });

  var revealedText = getRevealedText();
  var bubble = appendMessage('ai', '', { streaming: true });

  var accumulated = '';
  streamChat(
    '/api/companion',
    {
      revealedText: revealedText,
      messages: state.companionMsgs.slice(0, -1),
      userMessage: userText,
    },
    function (delta) {
      accumulated += delta;
      bubble.textContent = accumulated;
      $chatMessages.scrollTop = $chatMessages.scrollHeight;
    },
    function () {
      bubble.classList.remove('streaming');
      if (accumulated.trim()) {
        state.companionMsgs.push({ role: 'assistant', content: accumulated });
      } else {
        bubble.textContent = '(Your companion is quiet for a moment.)';
        bubble.style.opacity = '0.5';
      }
      state.aiTyping    = false;
      $btnSend.disabled = false;
    },
    function (err) {
      console.error('Companion error:', err);
      bubble.textContent = '(Your companion goes quiet.)';
      bubble.style.opacity = '0.5';
      bubble.classList.remove('streaming');
      state.aiTyping    = false;
      $btnSend.disabled = false;
    }
  );
}

// ─── Send character message ───────────────────────────────────────────────────

function sendCharacter(userText) {
  if (state.aiTyping || !userText.trim()) return;
  state.aiTyping = true;
  $btnSend.disabled = true;

  appendMessage('user', userText);
  state.characterMsgs.push({ role: 'user', content: userText });

  var ch     = currentChapter();
  var bubble = appendMessage('ai', '', { streaming: true });

  var accumulated = '';
  streamChat(
    '/api/character',
    {
      chapterText:     ch.paragraphs.join('\n\n'),
      chapterNum:      state.chapterIndex + 1,
      messages:        state.characterMsgs.slice(0, -1),
      userMessage:     userText,
      companionStance: state.companionStance,
    },
    function (delta) {
      accumulated += delta;
      bubble.textContent = accumulated;
      $chatMessages.scrollTop = $chatMessages.scrollHeight;
    },
    function () {
      bubble.classList.remove('streaming');
      if (accumulated.trim()) {
        state.characterMsgs.push({ role: 'assistant', content: accumulated });
      } else {
        bubble.textContent = '(He turns away. You may try again.)';
        bubble.style.opacity = '0.5';
      }
      state.aiTyping    = false;
      $btnSend.disabled = false;
    },
    function (err) {
      console.error('Character error:', err);
      bubble.textContent = '(He goes silent — try again.)';
      bubble.style.opacity = '0.5';
      bubble.classList.remove('streaming');
      state.aiTyping    = false;
      $btnSend.disabled = false;
    }
  );
}

// ─── Get revealed text for AI context ────────────────────────────────────────

function getRevealedText() {
  var ch    = currentChapter();
  var paras = ch.paragraphs.slice(0, state.revealedCount);
  return ch.title + '\n\n' + paras.join('\n\n');
}

// ─── Chapter end → character unlock ─────────────────────────────────────────

function endChapter() {
  if (state.phase !== 'reading') return;
  state.phase = 'transitioning';
  $btnEnd.classList.remove('visible');
  $btnEnd.disabled = true;

  // 1. Show transition overlay
  $transText.textContent = 'Chapter ends\u2026';
  $transOverlay.classList.add('show');

  // 2. Fetch stance, then transition
  var stancePayload = {
    chapterTitle:    currentChapter().title,
    companionMessages: state.companionMsgs,
  };

  fetch(API_BASE + '/api/stance', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(stancePayload),
  })
  .then(function (r) { return r.json(); })
  .catch(function () { return { stance: '' }; })
  .then(function (data) {
    state.companionStance = data.stance || '';

    setTimeout(function () {
      // Fade overlay out
      $transText.textContent = 'He\u2019s waiting\u2026';
      setTimeout(function () {
        $transOverlay.classList.remove('show');

        // Switch panel to character mode
        state.phase = 'character';
        state.characterMsgs = [];
        updateChatPanel();
        renderChapter();
        $chatMessages.innerHTML = '';
        appendMessage('system', '— Chapter ends. The Underground Man appears. —');

        // Trigger greeting from character
        triggerCharacterGreeting();

        $btnEnd.disabled = false;
      }, 800);
    }, 900);
  });
}

function triggerCharacterGreeting() {
  state.aiTyping = true;
  $btnSend.disabled = true;

  var ch     = currentChapter();
  var bubble = appendMessage('ai', '', { streaming: true });

  var accumulated = '';
  streamChat(
    '/api/character',
    {
      chapterText:     ch.paragraphs.join('\n\n'),
      chapterNum:      state.chapterIndex + 1,
      messages:        [],
      userMessage:     '',
      companionStance: state.companionStance,
      greeting:        true,
    },
    function (delta) {
      accumulated += delta;
      bubble.textContent = accumulated;
      $chatMessages.scrollTop = $chatMessages.scrollHeight;
    },
    function () {
      bubble.classList.remove('streaming');
      if (accumulated.trim()) {
        state.characterMsgs.push({ role: 'assistant', content: accumulated });
      }
      state.aiTyping    = false;
      $btnSend.disabled = false;
    },
    function (err) {
      console.error('Character greeting error:', err);
      bubble.textContent = '(He regards you in silence.)';
      bubble.style.opacity = '0.5';
      bubble.classList.remove('streaming');
      state.aiTyping    = false;
      $btnSend.disabled = false;
    }
  );
}

// ─── TOC ─────────────────────────────────────────────────────────────────────

function renderTOC() {
  $tocList.innerHTML = '';
  BOOK.chapters.forEach(function (ch, idx) {
    var li  = document.createElement('li');
    var btn = document.createElement('button');
    btn.textContent = ch.title;
    if (idx === state.chapterIndex) btn.classList.add('current');
    btn.addEventListener('click', function () {
      goChapter(idx);
      closeTOC();
    });
    li.appendChild(btn);
    $tocList.appendChild(li);
  });
}

function openTOC()  {
  renderTOC();
  $tocBackdrop.classList.add('open');
  $tocPanel.classList.add('open');
}
function closeTOC() {
  $tocBackdrop.classList.remove('open');
  $tocPanel.classList.remove('open');
}

function goChapter(idx) {
  startChapter(idx, true);
}

// ─── Next chapter (from character phase) ─────────────────────────────────────

function goNextChapter() {
  if (state.chapterIndex < BOOK.chapters.length - 1) {
    startChapter(state.chapterIndex + 1, true);
  }
}

// ─── Input handling ───────────────────────────────────────────────────────────

function handleSend() {
  var text = $chatInput.value.trim();
  if (!text) return;
  $chatInput.value = '';
  autoResize();
  if (state.phase === 'character') {
    sendCharacter(text);
  } else {
    sendCompanion(text);
  }
}

function autoResize() {
  $chatInput.style.height = 'auto';
  $chatInput.style.height = Math.min($chatInput.scrollHeight, 120) + 'px';
}

// ─── Keyboard: Enter reveals paragraph unless chat is focused ─────────────────

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  // If focus is inside chat input → let the textarea handle it via its own listener
  if (document.activeElement === $chatInput) return;
  // Otherwise: advance reading
  if (state.phase === 'reading') {
    e.preventDefault();
    revealNext();
  }
});

$chatInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

$chatInput.addEventListener('input', autoResize);

$btnSend.addEventListener('click', handleSend);

$btnReveal.addEventListener('click', function () { revealNext(); });

$btnEnd.addEventListener('click', endChapter);

$btnNext.addEventListener('click', goNextChapter);

// ─── Toolbar wiring ───────────────────────────────────────────────────────────

$btnToc.addEventListener('click', openTOC);
$tocClose.addEventListener('click', closeTOC);
$tocBackdrop.addEventListener('click', closeTOC);

$btnFontMinus.addEventListener('click', function () {
  state.fontSize = Math.max(FONT_MIN, state.fontSize - 1);
  applyFont();
});
$btnFontPlus.addEventListener('click', function () {
  state.fontSize = Math.min(FONT_MAX, state.fontSize + 1);
  applyFont();
});
$btnFontToggle.addEventListener('click', function () {
  state.fontFamily = state.fontFamily === 'serif' ? 'sans' : 'serif';
  applyFont();
});

document.querySelectorAll('[data-theme]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    setTheme(btn.getAttribute('data-theme'));
  });
});

// ─── Splash dismiss on click / Enter ─────────────────────────────────────────

var splashDismissed = false;
function dismissSplash() {
  if (splashDismissed) return;
  splashDismissed = true;
  $splashEl.classList.add('hide');
}

$splashEl.addEventListener('click', dismissSplash);
document.addEventListener('keydown', function (e) {
  if (!splashDismissed && (e.key === 'Enter' || e.key === ' ')) dismissSplash();
});

// Auto-dismiss after 2.5s
setTimeout(dismissSplash, 1500);

// ─── Boot ─────────────────────────────────────────────────────────────────────

setTheme(state.theme);
applyFont();

loadBook()
  .then(function () {
    if (state.chapterIndex >= BOOK.chapters.length) state.chapterIndex = 0;
    startChapter(state.chapterIndex, true);
  })
  .catch(function (err) {
    console.error('Failed to load book:', err);
    document.body.innerHTML = '<p style="padding:40px;opacity:0.5">Could not load the book. Please try refreshing.</p>';
  });

})();
</script>
</body>
</html>
